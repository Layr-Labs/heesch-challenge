name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # The standard 8 GB runner checks every proof inside the band except the
    # record-depth F(S,6) case, where cake_lpr needs > 6 GB of heap
    # (RESOURCE_EXCEEDED, out-of-band procedure). A larger-runner label here
    # (>= 12 GB) makes that case in-band; the harness sizes the CakeML heap
    # from available memory (override: HEESCH_CAKE_HEAP_MB).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 2
          persist-credentials: false

      # Yukon enforces editablePaths while constructing the commit. Keep this
      # independent check so a malformed submissions/* ref fails before setup.
      - name: Verify submission surface
        if: startsWith(github.ref, 'refs/heads/submissions/')
        shell: bash
        run: |
          set -euo pipefail

          read -r -a commit_line <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          if (( ${#commit_line[@]} != 2 )); then
            echo "Submission must be a single-parent commit" >&2
            exit 1
          fi

          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              submission|submission/*) ;;
              *)
                echo "Submission changed a non-editable path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --no-renames --name-only -z "$GITHUB_SHA^" "$GITHUB_SHA")

          # File-type surface (audit V12): the name-only check above is blind
          # to entry type, so a symlink (mode 120000) or gitlink (160000) at
          # submission/best.heesch passes it and would smuggle a host-file
          # read (V3) into the verifier. Require every entry under submission/
          # to be a regular blob (100644/100755).
          while IFS= read -r -d '' rec; do
            mode=${rec%% *}
            path=${rec#*$'\t'}
            case "$mode" in
              100644|100755) ;;
              *)
                echo "Submission entry has non-regular mode $mode: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-tree -r -z "$GITHUB_SHA" -- submission)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Runner preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          {
            uname -a
            python3 --version
            command -v bwrap && bwrap --version || echo "bubblewrap: absent"
            nproc; free -m | head -2; df -h /tmp | tail -1
            git rev-parse HEAD
          } | tee benchmark-results/runner.txt

      - name: Setup
        run: |
          ./setup.sh
          # setup.sh builds the proof checkers; the record tier is unreachable
          # without the formally-verified one, so fail the job loudly here
          # rather than rejecting every proof-carrying submission as
          # CHECKER_UNAVAILABLE.
          test -x tools/bin/drat-trim && test -x tools/bin/lrat-check && test -x tools/bin/cake_lpr
          ls -la tools/bin | tee -a benchmark-results/runner.txt

      - name: Benchmark
        run: ./benchmark.sh

      - name: Report score
        id: score
        shell: bash
        run: |
          set -euo pipefail

          score=$(jq -er '.score | select(type == "number")' score.json)
          hc=$(jq -er '.metrics.hc_verified | select(type == "number")' score.json)
          evidence=$(jq -er '.metrics.non_tiler_evidence | select(. == "census" or . == "proof")' score.json)
          exact=$(jq -r '.metrics.exact' score.json)
          echo "score=$score (hc_verified=$hc, non_tiler_evidence=$evidence, exact=$exact)" | tee -a benchmark-results/runner.txt
          echo "value=$score" >> "$GITHUB_OUTPUT"

      - name: Upload score
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-score
          path: score.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-diagnostics-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
