name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Build proof checkers
        if: runner.os == 'Linux'
        run: bash tools/build_checkers.sh
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Harness rejects tampering (e2e)
        if: runner.os == 'Linux'
        run: |
          # The committed baseline must produce a score via the real entrypoint.
          rm -f .yukon/score.json
          PYTHONHASHSEED=0 python -P -m harness.verify
          test -f .yukon/score.json
