name: CI

# Audit V9: CI must never run a participant-controlled tree. submissions/*
# refs are graded exclusively by benchmark.yml (sandboxed, surface-checked);
# this workflow builds/installs/tests the checked-out tree, so it is scoped to
# maintainer branches only. Never widen this to pull_request or
# pull_request_target without a sandbox — that reintroduces the RCE surface.
on:
  push:
    branches-ignore:
      - 'submissions/**'
  workflow_dispatch:

# Audit V9: least privilege. No write scope near an install+test of the tree.
permissions:
  contents: read

# Audit V11: collapse superseded runs so a burst of pushes cannot fan out into
# hours of matrix runner-time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # SHA-pinned (audit V9): mutable tags let a compromised action ship code
      # into the run. persist-credentials:false drops the checkout token.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Build proof checkers
        if: runner.os == 'Linux'
        run: |
          bash tools/build_checkers.sh
          # The record tier needs the formally-verified checker; the proof
          # e2e tests below run against the real cake_lpr on this runner.
          test -x tools/bin/cake_lpr
      - name: Tests
        if: runner.os == 'Linux'
        run: python -m pytest tests/ -q
      - name: Tests (per-file, diagnosing the Windows exit status)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path tests -Filter 'test_*.py' | ForEach-Object { $_.FullName }
          $bad = 0
          foreach ($f in $files) {
            python -m pytest $f -q -p no:cacheprovider 2>&1 | Select-Object -Last 1
            Write-Host "EXIT=$LASTEXITCODE  $f"
            if ($LASTEXITCODE -ne 0) { $bad = 1 }
          }
          exit $bad
      - name: Proof path e2e (real checkers) and census regression
        if: runner.os == 'Linux'
        run: python -m pytest tests/test_proof_gate.py tests/test_census_gate.py -q -rs
      - name: Harness e2e via the real scripts
        if: runner.os == 'Linux'
        run: |
          # Smoke-tests the committed baseline on maintainer branches only
          # (submissions/* never reach this workflow). Yukon grades real
          # submissions via benchmark.yml.
          bash ./setup.sh
          test -x tools/bin/cake_lpr
          bash ./benchmark.sh
          test -f score.json
          jq -er '.score | select(type == "number")' score.json
          jq -er '.metrics.non_tiler_evidence | select(. == "census")' score.json
